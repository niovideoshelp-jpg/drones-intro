name: Drones - review and render
# Outputs go to GitHub Releases (not Actions artifacts, whose storage quota is shared by the account).
on:
  workflow_dispatch:
    inputs:
      part:
        type: choice
        options: [intro, part1, part2, part3]
        default: intro
      mode:
        type: choice
        options: [review, final]
        default: review
      tag:
        description: Release tag (review builds append "-review")
        default: v1
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      chunks: ${{ steps.t.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc && npx eslint src
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Part settings
        run: bash scripts/part-env.sh "${{ inputs.part }}" >> "$GITHUB_ENV"
      - name: Build soundtrack
        run: |
          node scripts/sfx-prep.mjs
          node "$MIX"
          for f in voice music sfx mix; do echo "== $f"; ffmpeg -hide_banner -i "public/audio/${PREFIX}$f.wav" -af ebur128=peak=true -f null - 2>&1 | grep -A14 Summary | grep -E "I:|Peak:"; done
      - id: t
        name: Create an empty release to receive the files
        run: |
          TAG="$NAME-${{ inputs.tag }}"
          if [ "${{ inputs.mode }}" = "review" ]; then TAG="$TAG-review"; fi
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" --prerelease --title "$NAME ${{ inputs.tag }} (${{ inputs.mode }})" --notes "Building…" --target "${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "chunks=[$(seq 0 $((CHUNKS - 1)) | paste -sd, -)]" >> "$GITHUB_OUTPUT"

  render:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.prepare.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bash scripts/part-env.sh "${{ inputs.part }}" >> "$GITHUB_ENV"
      - run: node scripts/sfx-prep.mjs && node "$MIX"
      - name: Render part
        run: |
          STEP=$(( (FRAMES + CHUNKS - 1) / CHUNKS ))
          START=$(( ${{ matrix.part }} * STEP ))
          END=$(( START + STEP - 1 ))
          if [ "$END" -ge "$FRAMES" ]; then END=$(( FRAMES - 1 )); fi
          N=$(( ${{ matrix.part }} + 1 ))
          mkdir -p out
          if [ "${{ inputs.mode }}" = "review" ]; then
            npx remotion render src/index.ts "$COMP-preview" "out/review-part$N.mp4" --frames="$START-$END" --codec=h264 --crf=26 --scale=0.5 --muted --concurrency=$(nproc) --image-format=jpeg --pixel-format=yuv420p
          else
            npx remotion render src/index.ts "$COMP" out/raw.mov --frames="$START-$END" --codec=prores --prores-profile=4444 --pixel-format=yuva444p10le --image-format=png --muted --concurrency=$(nproc)
            ffmpeg -y -i out/raw.mov -c:v libvpx-vp9 -pix_fmt yuva420p -crf 28 -b:v 0 -row-mt 1 -deadline good -cpu-used 3 -auto-alt-ref 0 -g 60 -an -metadata:s:v:0 alpha_mode=1 "out/webm-part$N.webm"
            rm out/raw.mov
          fi
          ls -la out
      - name: Upload part to the release
        run: |
          shopt -s nullglob
          files=(out/*part*.mp4 out/*part*.webm)
          gh release upload "${{ needs.prepare.outputs.tag }}" "${files[@]}" --clobber

  assemble:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg zip
      - run: bash scripts/part-env.sh "${{ inputs.part }}" >> "$GITHUB_ENV"
      - run: node scripts/sfx-prep.mjs && node "$MIX"
      - name: Download parts
        run: |
          mkdir -p parts dist
          if [ "${{ inputs.mode }}" = "review" ]; then P="review-part*"; else P="webm-part*"; fi
          gh release download "${{ needs.prepare.outputs.tag }}" -D parts -p "$P"
          ls -la parts
      - name: Review MP4
        if: inputs.mode == 'review'
        run: |
          for i in $(seq 1 $CHUNKS); do echo "file 'parts/review-part$i.mp4'"; done > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy picture.mp4
          ffmpeg -y -i picture.mp4 -i "public/audio/${PREFIX}mix.wav" -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart "dist/${NAME}-review.mp4"
          for i in $(seq 1 $CHUNKS); do gh release delete-asset "${{ needs.prepare.outputs.tag }}" "review-part$i.mp4" -y; done
      - name: Final extras (verification, stems, quick-look)
        if: inputs.mode == 'final'
        run: |
          for i in $(seq 1 $CHUNKS); do echo "file 'parts/webm-part$i.webm'"; done > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy picture.webm
          ffmpeg -y -i picture.webm -i "public/audio/${PREFIX}mix.wav" -map 0:v -map 1:a -c:v copy -c:a libopus -b:a 192k -shortest "dist/${NAME}_alpha.webm"
          {
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate:stream_tags=alpha_mode -of compact "dist/${NAME}_alpha.webm"
            ffmpeg -hide_banner -c:v libvpx-vp9 -ss 60 -i "dist/${NAME}_alpha.webm" -frames:v 1 -vf "format=rgba,alphaextract,signalstats,metadata=print:key=lavfi.signalstats.YMIN,metadata=print:key=lavfi.signalstats.YMAX" -f null - 2>&1 | grep -E "YMIN|YMAX"
          } | tee dist/VERIFY.txt
          grep -q "YMIN=0" dist/VERIFY.txt || (echo "alpha plane missing" && exit 1)
          (cd public/audio && zip -9 "../../dist/${NAME}_audio_stems.zip" "${PREFIX}mix.wav" "${PREFIX}voice.wav" "${PREFIX}music.wav" "${PREFIX}sfx.wav")
          ffmpeg -y -c:v libvpx-vp9 -i "dist/${NAME}_alpha.webm" -filter_complex "color=c=0x3b4447:s=1920x1080:r=30[bg];[bg][0:v]overlay=shortest=1,scale=1280:720,format=yuv420p[v]" -map "[v]" -map 0:a -c:v libx264 -crf 24 -preset veryfast -c:a aac -b:a 192k -movflags +faststart "dist/${NAME}_quicklook.mp4"
          for i in $(seq 1 $CHUNKS); do gh release delete-asset "${{ needs.prepare.outputs.tag }}" "webm-part$i.webm" -y; done
      - name: Publish
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" dist/* --clobber
          NOTES="Review render (half resolution, grey background) with the final mix."
          if [ "${{ inputs.mode }}" = "final" ]; then NOTES="${NAME}_alpha.webm: full part, VP9 with alpha + mix (import straight into Filmora). Audio stems and a quick-look MP4 on grey."; fi
          gh release edit "${{ needs.prepare.outputs.tag }}" --notes "$NOTES"
