name: Drones intro - review and render
# Outputs go to GitHub Releases (not Actions artifacts, whose storage quota is shared by the account).
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [review, final]
        default: review
      tag:
        description: Release tag (review builds use "<tag>-review")
        default: v1
permissions:
  contents: write
env:
  TOTAL_FRAMES: 5322
  GH_TOKEN: ${{ github.token }}
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc && npx eslint src
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Build soundtrack and check SFX sync
        run: |
          node scripts/sfx-prep.mjs
          node scripts/mix.mjs
          node scripts/sync-check.mjs
          for f in voice music sfx mix; do echo "== $f"; ffmpeg -hide_banner -i public/audio/$f.wav -af ebur128=peak=true -f null - 2>&1 | grep -A14 Summary | grep -E "I:|Peak:"; done
      - id: t
        name: Create an empty release to receive the files
        run: |
          TAG="${{ inputs.tag }}"
          if [ "${{ inputs.mode }}" = "review" ]; then TAG="$TAG-review"; fi
          gh release delete "$TAG" -y --cleanup-tag || true
          gh release create "$TAG" --prerelease --title "Drones intro $TAG" --notes "Building…" --target "${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  render:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/sfx-prep.mjs && node scripts/mix.mjs
      - name: Render part
        run: |
          STEP=$(( (TOTAL_FRAMES + 5) / 6 ))
          START=$(( ${{ matrix.part }} * STEP ))
          END=$(( START + STEP - 1 ))
          if [ "$END" -ge "$TOTAL_FRAMES" ]; then END=$(( TOTAL_FRAMES - 1 )); fi
          N=$(( ${{ matrix.part }} + 1 ))
          mkdir -p out
          if [ "${{ inputs.mode }}" = "review" ]; then
            npx remotion render src/index.ts DronesIntro-preview "out/review-part$N.mp4" --frames="$START-$END" --codec=h264 --crf=26 --scale=0.5 --muted --concurrency=$(nproc) --image-format=jpeg --pixel-format=yuv420p
          else
            npx remotion render src/index.ts DronesIntro out/raw.mov --frames="$START-$END" --codec=prores --prores-profile=4444 --pixel-format=yuva444p10le --image-format=png --muted --concurrency=$(nproc)
            SS=$(awk "BEGIN{printf \"%.4f\", $START/30}")
            DUR=$(awk "BEGIN{printf \"%.4f\", ($END-$START+1)/30}")
            # main deliverable: VP9 with alpha (joined later); fallback: lighter ProRes 4444 part with its slice of the mix
            ffmpeg -y -i out/raw.mov -c:v libvpx-vp9 -pix_fmt yuva420p -crf 28 -b:v 0 -row-mt 1 -deadline good -cpu-used 3 -auto-alt-ref 0 -g 60 -an -metadata:s:v:0 alpha_mode=1 "out/webm-part$N.webm"
            ffmpeg -y -i out/raw.mov -ss "$SS" -t "$DUR" -i public/audio/mix.wav -map 0:v -map 1:a -c:v prores_ks -profile:v 4 -pix_fmt yuva444p10le -alpha_bits 8 -qscale:v 13 -vendor apl0 -c:a pcm_s16le -shortest "out/DronesIntro_alpha_ProRes4444_part$N.mov"
            rm out/raw.mov
          fi
          ls -la out
      - name: Upload part to the release
        run: gh release upload "${{ needs.prepare.outputs.tag }}" out/*part* --clobber

  assemble:
    needs: [prepare, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg zip
      - run: node scripts/sfx-prep.mjs && node scripts/mix.mjs
      - name: Download parts
        run: |
          mkdir -p parts dist
          if [ "${{ inputs.mode }}" = "review" ]; then P="review-part*"; else P="webm-part*"; fi
          gh release download "${{ needs.prepare.outputs.tag }}" -D parts -p "$P"
          ls -la parts
      - name: Review MP4
        if: inputs.mode == 'review'
        run: |
          for i in 1 2 3 4 5 6; do echo "file 'parts/review-part$i.mp4'"; done > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy picture.mp4
          ffmpeg -y -i picture.mp4 -i public/audio/mix.wav -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest -movflags +faststart dist/DronesIntro-review.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,nb_frames -of compact dist/DronesIntro-review.mp4
          for i in 1 2 3 4 5 6; do gh release delete-asset "${{ needs.prepare.outputs.tag }}" "review-part$i.mp4" -y; done
      - name: Final extras (verification, stems, quick-look)
        if: inputs.mode == 'final'
        run: |
          for i in 1 2 3 4 5 6; do echo "file 'parts/webm-part$i.webm'"; done > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy picture.webm
          ffmpeg -y -i picture.webm -i public/audio/mix.wav -map 0:v -map 1:a -c:v copy -c:a libopus -b:a 192k -shortest dist/DronesIntro_alpha.webm
          {
            ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate:stream_tags=alpha_mode -of compact dist/DronesIntro_alpha.webm
            # decode with libvpx so the alpha plane is read; report min/max alpha of a mid frame
            ffmpeg -hide_banner -c:v libvpx-vp9 -ss 60 -i dist/DronesIntro_alpha.webm -frames:v 1 -vf "format=rgba,alphaextract,signalstats,metadata=print:key=lavfi.signalstats.YMIN,metadata=print:key=lavfi.signalstats.YMAX" -f null - 2>&1 | grep -E "YMIN|YMAX"
          } | tee dist/VERIFY.txt
          grep -q "YMIN=0" dist/VERIFY.txt || (echo "alpha plane missing" && exit 1)
          (cd public/audio && zip -9 ../../dist/DronesIntro_audio_stems.zip mix.wav voice.wav music.wav sfx.wav)
          ffmpeg -y -c:v libvpx-vp9 -i dist/DronesIntro_alpha.webm -filter_complex "color=c=0x3b4447:s=1920x1080:r=30[bg];[bg][0:v]overlay=shortest=1,scale=1280:720,format=yuv420p[v]" -map "[v]" -map 0:a -c:v libx264 -crf 24 -preset veryfast -c:a aac -b:a 192k -movflags +faststart dist/DronesIntro_quicklook.mp4
          for i in 1 2 3 4 5 6; do gh release delete-asset "${{ needs.prepare.outputs.tag }}" "webm-part$i.webm" -y; done
      - name: Publish
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" dist/* --clobber
          NOTES="Review render (half resolution, grey background) with the final mix."
          if [ "${{ inputs.mode }}" = "final" ]; then NOTES="DronesIntro_alpha.webm: full film, VP9 with alpha + mix (import straight into Filmora). ProRes 4444 alpha fallback in 6 consecutive parts (import in order 1→6). Audio stems and a quick-look MP4 on grey."; fi
          gh release edit "${{ needs.prepare.outputs.tag }}" --notes "$NOTES"
